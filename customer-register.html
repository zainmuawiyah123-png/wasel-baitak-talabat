<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل زبون جديد</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 90px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff5a00;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #e05000;
        }
        .location-btn {
            background-color: #28a745;
            margin-top: 5px;
        }
        .location-btn:hover {
            background-color: #218838;
        }
        #location-status, #save-status {
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تسجيل زبون جديد</h2>
    <form id="customerForm" onsubmit="saveCustomer(event)">
        
        <!-- حقل الاسم -->
        <div class="form-group">
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" name="name" required placeholder="أدخل اسم الزبون الثلاثي">
        </div>

        <!-- حقل رقم الهاتف -->
        <div class="form-group">
            <label for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" name="phone" required placeholder="مثال: 0790000000">
        </div>

        <!-- حقل العنوان بالتفصيل -->
        <div class="form-group">
            <label for="address">العنوان بالتفصيل:</label>
            <textarea id="address" name="address" required placeholder="المدينة، المنطقة، اسم الشارع، رقم المبنى..."></textarea>
        </div>

        <!-- حقل موقع GPS -->
        <div class="form-group">
            <label for="gps">موقع GPS:</label>
            <input type="text" id="gps" name="gps" placeholder="الإحداثيات (خط العرض، خط الطول)" readonly>
            <button type="button" class="location-btn" onclick="getLocation()">تحديد موقعي الحالي تلقائياً</button>
            <div id="location-status"></div>
        </div>

        <!-- زر الإرسال -->
        <button type="submit">حفظ البيانات</button>
        <div id="save-status"></div>
    </form>
</div>

<script>
    function getLocation() {
        const statusDiv = document.getElementById("location-status");
        const gpsInput = document.getElementById("gps");

        if (!navigator.geolocation) {
            statusDiv.innerHTML = "المتصفح لا يدعم تحديد الموقع الجغرافي.";
            statusDiv.style.color = "red";
            return;
        }

        statusDiv.innerHTML = "جاري تحديد الموقع...";
        statusDiv.style.color = "#666";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                gpsInput.value = `${latitude}, ${longitude}`;
                statusDiv.innerHTML = "تم تحديث الموقع بنجاح! ✓";
                statusDiv.style.color = "green";
            },
            (error) => {
                statusDiv.innerHTML = "تعذر الحصول على الموقع. يرجى التحقق من أذونات المتصفح.";
                statusDiv.style.color = "red";
            }
        );
    }

    function saveCustomer(event) {
        event.preventDefault(); // منع إعادة تحميل الصفحة
        
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const address = document.getElementById("address").value;
        const gps = document.getElementById("gps").value;
        const saveStatus = document.getElementById("save-status");

        // حفظ البيانات في ذاكرة المتصفح (LocalStorage)
        const customerData = { name, phone, address, gps };
        localStorage.setItem("customer_" + phone, JSON.stringify(customerData));

        saveStatus.innerHTML = "🎉 تم حفظ بيانات الزبون بنجاح!";
        saveStatus.style.color = "green";

        // تفريغ الحقول بعد الحفظ (اختياري)
        document.getElementById("customerForm").reset();
        document.getElementById("location-status").innerHTML = "";
    }
</script>

</body>
</html>
